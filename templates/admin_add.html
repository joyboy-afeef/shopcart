{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div class="admin-panel">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <div class="admin-badge">Admin</div>
      <h2 style="margin: 0;">Add New Product</h2>
    </div>
    
    <form method="post" class="form-card" enctype="multipart/form-data" onsubmit="return validateProductForm()">
      <!-- Basic Information -->
      <div style="border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Product Details</h3>
        
        <label>
          Product Name *
          <input type="text" name="name" id="product-name" placeholder="Example: Blue Running Sneakers" required 
                 minlength="3" maxlength="200" />
        </label>

        <label>
          Brand *
          <input type="text" name="brand" placeholder="Example: Nike" required 
                 minlength="2" maxlength="100" />
        </label>

        <label>
          Price (₹) *
          <input type="number" name="price" step="0.01" min="0.01" max="999999" 
                 placeholder="29.99" required title="Enter a positive price" />
        </label>

        <label>
          Description
          <small style="font-weight: normal; color: var(--text-secondary);">Describe features, material, size, etc.</small>
          <textarea name="description" placeholder="High-quality breathable material, perfect for sports and daily wear..."
                    maxlength="2000"></textarea>
        </label>
      </div>

      <!-- Images & Media -->
      <div style="padding-bottom: 20px; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Images & Media</h3>
        
        <label>
          Primary Image URL
          <small style="font-weight: normal; color: var(--text-secondary);">Or upload below. Supports: PNG, JPG, GIF, WebP</small>
          <input type="url" name="image_url" placeholder="https://example.com/product.jpg" />
        </label>

        <label>
          Upload Primary Image
          <small style="font-weight: normal; color: var(--text-secondary);">Recommended size: 260×240px or larger</small>
          <input type="file" name="primary_image" accept="image/png,image/jpeg,image/gif,image/webp" />
        </label>

        <label>
          Upload Additional Images/Videos
          <small style="font-weight: normal; color: var(--text-secondary);">Select multiple files. Max: PNG, JPG, GIF, WebP, MP4, WebM, OGG</small>
          <input type="file" name="media_files" multiple accept="image/*,video/*" />
        </label>

        <label>
          Additional Media URLs (one per line)
          <small style="font-weight: normal; color: var(--text-secondary);">Useful for linking images hosted elsewhere</small>
          <textarea name="media_urls" placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.jpg"
                    maxlength="5000"></textarea>
        </label>
      </div>

      <!-- Form Actions -->
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="button" type="submit" style="flex: 1; min-width: 150px;">✓ Add Product</button>
        <a class="button outline" href="/admin/products" style="flex: 1; min-width: 150px; text-align: center;">View All Products</a>
        <a class="button secondary" href="/admin" style="flex: 1; min-width: 150px; text-align: center;">← Back to Dashboard</a>
      </div>
    </form>

    <div style="margin-top: 20px; padding: 14px; background: var(--surface-alt); border-radius: var(--radius); border-left: 4px solid var(--primary);">
      <strong style="color: var(--primary);">💡 Tip:</strong> You can upload images from your device or provide URLs. URLs are useful for linking to images hosted on other servers.
    </div>
  </div>
</div>

<script>
function validateProductForm() {
  const name = document.getElementById('product-name').value.trim();
  if (name.length < 3) {
    alert('Product name must be at least 3 characters long');
    return false;
  }
  return true;
}
</script>
{% endblock %}
